{% extends "base.html" %}
{% block title %}Add Faculty{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <h1>Add Faculty</h1>
    <div class="sub">Create a new faculty or admin account</div>
  </div>
</div>

<div class="panel settings-panel" style="max-width:480px;">
  {% if error %}<div class="flash-error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" placeholder="name@sci.edu.ph" required>
    </div>
    <div class="field">
      <label for="role">Role</label>
      <select id="role" name="role" style="width:100%; padding:11px 13px;">
        <option value="faculty" {{ 'selected' if form.get('role', 'faculty') == 'faculty' }}>Faculty</option>
        <option value="admin" {{ 'selected' if form.get('role') == 'admin' }}>Admin</option>
      </select>
    </div>
    <div class="field">
      <label for="password">Initial Password</label>
      <input type="text" id="password" name="password" value="{{ form.get('password', '') }}" placeholder="Temporary password" required>
    </div>
    <button class="add-btn" type="submit">Create Account</button>
    <a href="{{ url_for('main.faculty') }}" style="margin-left:14px; font-size:13px; color:var(--ink-soft);">Cancel</a>
  </form>
</div>
{% endblock %}
