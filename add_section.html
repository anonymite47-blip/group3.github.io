{% extends "base.html" %}
{% block title %}Add Section{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <h1>Add Section</h1>
    <div class="sub">Create a new class section</div>
  </div>
</div>

<div class="panel settings-panel" style="max-width:480px;">
  {% if error %}<div class="flash-error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field">
      <label for="name">Section Name</label>
      <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" placeholder="BSCS 3A" required>
    </div>
    <div class="field">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" value="{{ form.get('subject', '') }}" placeholder="Data Structures" required>
    </div>
    <p style="font-size:11.5px; color:var(--ink-soft); margin:-8px 0 16px;">The adviser isn't set here — advisers claim their own subjects from the Sections list after creating it.</p>
    <div class="field">
      <label for="school_year">School Year</label>
      <input type="text" id="school_year" name="school_year" value="{{ form.get('school_year', '') }}" placeholder="2026-2027">
    </div>
    <div class="field">
      <label for="semester">Semester</label>
      <select id="semester" name="semester" style="width:100%; padding:11px 13px;">
        <option value="">— Select —</option>
        <option value="1st Semester" {{ 'selected' if form.get('semester') == '1st Semester' }}>1st Semester</option>
        <option value="2nd Semester" {{ 'selected' if form.get('semester') == '2nd Semester' }}>2nd Semester</option>
        <option value="Summer" {{ 'selected' if form.get('semester') == 'Summer' }}>Summer</option>
      </select>
    </div>
    <button class="add-btn" type="submit">Create Section</button>
    <a href="{{ url_for('main.sections') }}" style="margin-left:14px; font-size:13px; color:var(--ink-soft);">Cancel</a>
  </form>
</div>
{% endblock %}
