<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Santa Cruz Institute Attendance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<div class="login-frame">
  <div class="login-side">
    <div class="seal-lg">SCI</div>
    <h2>Create Your Student Account</h2>
    <p>Register with your mobile number to receive real-time attendance updates.</p>
    <div class="tag">Santa Cruz Institute (Marinduque), Inc.</div>
  </div>
  <div class="login-main">
    <form class="login-form" method="POST">
      <h3>Sign up</h3>
      <p class="lead">We'll text you a code to verify your number.</p>

      {% if error %}
        <div class="flash-error">{{ error }}</div>
      {% endif %}

      <div class="field">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" placeholder="you@sci.edu.ph" required>
      </div>
      <div class="field">
        <label for="student_no">Student No.</label>
        <input type="text" id="student_no" name="student_no" value="{{ form.get('student_no', '') }}" placeholder="2023-00000" required>
      </div>
      <div class="field">
        <label for="phone_number">Mobile Number</label>
        <input type="text" id="phone_number" name="phone_number" value="{{ form.get('phone_number', '') }}" placeholder="09171234567" required>
      </div>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" style="width:100%; padding:11px 13px;">
          <option value="">— Select —</option>
          <option value="Male" {{ 'selected' if form.get('gender') == 'Male' }}>Male</option>
          <option value="Female" {{ 'selected' if form.get('gender') == 'Female' }}>Female</option>
        </select>
      </div>
      <div class="field">
        <label for="year_level">Year Level</label>
        <select id="year_level" name="year_level" style="width:100%; padding:11px 13px;">
          <option value="">— Select —</option>
          <option value="1st Year" {{ 'selected' if form.get('year_level') == '1st Year' }}>1st Year</option>
          <option value="2nd Year" {{ 'selected' if form.get('year_level') == '2nd Year' }}>2nd Year</option>
          <option value="3rd Year" {{ 'selected' if form.get('year_level') == '3rd Year' }}>3rd Year</option>
          <option value="4th Year" {{ 'selected' if form.get('year_level') == '4th Year' }}>4th Year</option>
        </select>
      </div>
      <div class="field">
        <label for="section_id">Section</label>
        <select id="section_id" name="section_id" style="width:100%; padding:11px 13px;">
          <option value="">— Select later —</option>
          {% for s in sections %}
          <option value="{{ s.id }}" {{ 'selected' if form.get('section_id', '')|string == s.id|string }}>{{ s.name }} — {{ s.subject }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="login-btn" type="submit">Create Account</button>

      <div class="oauth-divider"><span>or</span></div>
      <a class="google-btn" href="{{ url_for('auth.google_login') }}">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.96H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.04l3.01-2.34Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .94 4.96l3.01 2.34C4.66 5.17 6.65 3.58 9 3.58Z"/></svg>
        Sign up with Google
      </a>

      <a class="forgot" href="{{ url_for('auth.login') }}">Already have an account? Sign in</a>
    </form>
  </div>
</div>
</body>
</html>
